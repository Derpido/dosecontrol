<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DoseControl prototype: monitor simulated vancomycin patients and approve dose recommendations from a microneedle patch.">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>DoseControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky ward bar over a calm board of patient cards; a patient page leads with the dose decision, then the evidence behind it. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #F6F8F7;
  --sunken: #E9EEEC;
  --ink: #16201E;
  --ink-2: #46524F;
  --ink-3: #5F6B68;
  --line: #DFE5E3;
  --line-2: #C9D2CF;
  --accent: #1D5F73;
  --accent-hover: #174D5E;
  --accent-soft: #E3EFF2;
  --on-accent: #FFFFFF;
  --ok: #276B43;
  --ok-soft: #E3F1E8;
  --warn: #8F5400;
  --warn-soft: #FBF0DC;
  --crit: #AE2F29;
  --crit-soft: #FAE6E4;
  --info: #3D5560;
  --info-soft: #E8EEF0;
  --band: #E1EFE6;
  --bar: #9AA7A3;
  --scrim: rgba(14, 22, 20, 0.32);
  --toast-bg: #16201E;
  --toast-fg: #F2F5F4;
  --shadow: 0 1px 2px rgba(22, 32, 30, 0.05), 0 4px 14px rgba(22, 32, 30, 0.06);
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1413; --surface: #151D1B; --surface-2: #19221F; --sunken: #0B100F;
    --ink: #E2EAE7; --ink-2: #AEBBB7; --ink-3: #8E9C98; --line: #24302D; --line-2: #33423E;
    --accent: #7EC1D2; --accent-hover: #9AD0DE; --accent-soft: #17323A; --on-accent: #0A1A1F;
    --ok: #79C797; --ok-soft: #132A1D; --warn: #E5B25F; --warn-soft: #2D2310; --crit: #EF928A; --crit-soft: #361A18;
    --info: #A9C1CA; --info-soft: #1A272C; --band: #15291E; --bar: #5E6E6A;
    --scrim: rgba(0, 0, 0, 0.5); --toast-bg: #E2EAE7; --toast-fg: #0E1413; --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #151D1B; --surface-2: #19221F; --sunken: #0B100F;
  --ink: #E2EAE7; --ink-2: #AEBBB7; --ink-3: #8E9C98; --line: #24302D; --line-2: #33423E;
  --accent: #7EC1D2; --accent-hover: #9AD0DE; --accent-soft: #17323A; --on-accent: #0A1A1F;
  --ok: #79C797; --ok-soft: #132A1D; --warn: #E5B25F; --warn-soft: #2D2310; --crit: #EF928A; --crit-soft: #361A18;
  --info: #A9C1CA; --info-soft: #1A272C; --band: #15291E; --bar: #5E6E6A;
  --scrim: rgba(0, 0, 0, 0.5); --toast-bg: #E2EAE7; --toast-fg: #0E1413; --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); font-weight: 400; }
svg { flex: none; }

/* notice + bar */
.notice { background: var(--sunken); color: var(--ink-2); font-size: 13px; }
.notice .wrap { padding-block: 6px; display: flex; align-items: center; gap: 8px; }
.notice svg { width: 15px; height: 15px; color: var(--ink-3); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.brand svg { width: 26px; height: 26px; }
.ward-name { color: var(--ink-2); font-size: 14px; padding-left: 16px; border-left: 1px solid var(--line); }
.clock { display: flex; align-items: baseline; gap: 8px; margin-left: auto; }
.clock-time { font-family: var(--font-data); font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; }
.clock-day { color: var(--ink-3); font-size: 13.5px; }
.speed { align-self: center; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.bar-actions { display: flex; align-items: center; gap: 10px; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 700; background: var(--crit-soft); color: var(--crit); cursor: pointer; white-space: nowrap; }
.pill-btn svg { width: 16px; height: 16px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.badge { position: absolute; top: -6px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--crit); color: var(--surface); font: 700 12px/20px var(--font-ui); text-align: center; }
.user { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
@media (max-width: 820px) {
  .ward-name, .user-name { display: none; }
  .bar-actions { width: 100%; justify-content: space-between; }
}
@media (max-width: 480px) {
  .user, .pill-word { display: none; }
  .bar-actions { gap: 8px; }
  .ward-tools .seg { flex-wrap: wrap; }
}

/* controls */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunken); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
.seg .ct { font-family: var(--font-data); font-size: 12.5px; margin-left: 5px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.small { padding: 6px 11px; font-size: 14px; }
select { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); max-width: 100%; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip svg { width: 15px; height: 15px; }
.crit { --c: var(--crit); --cs: var(--crit-soft); }
.warn { --c: var(--warn); --cs: var(--warn-soft); }
.ok { --c: var(--ok); --cs: var(--ok-soft); }
.info { --c: var(--info); --cs: var(--info-soft); }
.chip, .tag, .calm-ic, .ai { color: var(--c, var(--ink-2)); background: var(--cs, var(--sunken)); }

/* ward */
.page { padding-block: 22px 112px; }
.ward-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 18px; }
.ward-head h1 { font-size: 27px; line-height: 1.15; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin-top: 4px; }
.ward-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 100%; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s; }
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.card.s-review { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.bed { font-family: var(--font-data); font-size: 13px; color: var(--ink-2); letter-spacing: 0.02em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.who b { display: block; font-size: 17px; line-height: 1.25; }
.who span { color: var(--ink-2); font-size: 13.5px; }
.lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.exp-v { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; margin-top: 2px; }
.num { font-family: var(--font-data); font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.unit { color: var(--ink-3); font-size: 13px; }
.trend { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; color: var(--ink-2); }
.trend svg { width: 14px; height: 14px; }
.gauge { position: relative; height: 10px; margin: 12px 0 2px; border-radius: 999px; background: var(--sunken); }
.g-band { position: absolute; top: 0; bottom: 0; background: var(--band); border-left: 1.5px solid var(--ok); border-right: 1.5px solid var(--ok); }
.g-ring, .g-dot { position: absolute; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); }
.g-ring { width: 18px; height: 18px; border: 2px solid var(--ink); }
.g-dot { width: 10px; height: 10px; background: var(--ink); }
.g-scale { position: relative; height: 16px; font: 11px var(--font-data); color: var(--ink-3); }
.g-scale span { position: absolute; top: 2px; transform: translateX(-50%); }
.exp-f { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.k-ring { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; display: inline-block; }
.k-dot { width: 8px; height: 8px; background: var(--ink); border-radius: 50%; display: inline-block; margin-inline: 2px; }
.est-note { display: flex; gap: 9px; align-items: flex-start; padding: 12px; border-radius: 10px; background: var(--info-soft); color: var(--info); font-size: 14px; }
.est-note svg { width: 17px; height: 17px; margin-top: 1px; }
.spark-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.spark { height: 36px; }
.spark svg { display: block; }
.sp-line { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linejoin: round; }
.sp-area { fill: var(--accent); fill-opacity: 0.08; }
.sp-end { fill: var(--accent); }
.det { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.rec-line { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 9px; background: var(--crit-soft); color: var(--crit); font-size: 14px; }
.rec-line svg { width: 16px; height: 16px; margin-top: 2px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-top: auto; padding-top: 11px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); }
.foot b { color: var(--ink); }
.pst { display: inline-flex; align-items: center; gap: 5px; }
.pst svg { width: 15px; height: 15px; }
.pst.warn, .pst.crit, .pst.info { color: var(--c); background: none; font-weight: 700; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r); }
.chart .empty { padding: 18px 12px; }
.foot-note { margin-top: 18px; max-width: 82ch; font-size: 13.5px; color: var(--ink-3); }
.foot-note .k-ring, .foot-note .k-dot { vertical-align: -1px; }

/* patient page */
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; font-weight: 700; text-decoration: none; }
.back svg { width: 18px; height: 18px; }
.pv-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.pv-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pv-title h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.01em; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap: 12px 18px; margin: 10px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fact { min-width: 0; }
.fact dt { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.fact dd { margin: 3px 0 0; font-weight: 700; }
.decide { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; padding: 20px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; }
.decide.calm { border: 1px solid var(--line); padding: 16px 18px; }
.eyebrow { font-size: 12.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.07em; }
.decide h2 { margin-top: 4px; font-size: 23px; line-height: 1.2; }
.decide.calm h2 { font-size: 18px; margin-top: 0; }
.calm-row { display: flex; gap: 12px; align-items: flex-start; }
.calm-ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.calm-ic svg { width: 19px; height: 19px; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; }
.opt { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.opt.rec { border-color: var(--accent); background: var(--accent-soft); }
.opt-l { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.big { font-family: var(--font-data); font-size: 31px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
.arrow { align-self: center; color: var(--ink-3); font-size: 22px; }
.tag { align-self: flex-start; margin-top: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
@media (max-width: 600px) { .compare { grid-template-columns: minmax(0, 1fr); } .arrow { display: none; } }
.why { display: flex; flex-direction: column; gap: 6px; margin: 0; padding-left: 20px; max-width: 78ch; color: var(--ink-2); }
.why b { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.confirm { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; max-width: 70ch; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.fine { font-size: 13.5px; color: var(--ink-3); }
.field { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
.field label { font-size: 14px; font-weight: 700; }
.dose-opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.dose-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.dose-opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.dose-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.do-main { display: flex; flex-direction: column; min-width: 0; }
.do-sub { font-size: 13px; color: var(--ink-2); }
.do-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.do-tag { font-size: 12px; font-weight: 700; color: var(--accent); }
.pv-grid, .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; }
.panel h2 { font-size: 17px; }
.cap { margin-top: 2px; font-size: 13.5px; color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.sw-line { width: 18px; border-top: 2.5px solid var(--accent); }
.sw-dash { width: 18px; border-top: 2px dashed var(--ink-3); }
.sw-dash.acc { border-top-color: var(--accent); }
.sw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); opacity: 0.6; }
.sw-dose { width: 12px; height: 7px; border-radius: 2px; background: var(--ink-3); }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; max-width: 100%; height: auto; }
.tip { position: absolute; top: 4px; z-index: 2; min-width: 170px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; color: var(--ink-2); pointer-events: none; }
.tip b { font-family: var(--font-data); color: var(--ink); }
.tip-t { font-family: var(--font-data); font-weight: 500; color: var(--ink); margin-bottom: 2px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row:first-child { border-top: 0; }
.row .st { font-size: 13px; color: var(--ink-3); text-align: right; }
.row .st.next { color: var(--accent); font-weight: 700; }
.row-h { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 4px; }
time small, .tm small { display: block; font-family: var(--font-ui); font-size: 12px; color: var(--ink-3); }
.tm { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.wear-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.wear { height: 8px; overflow: hidden; border-radius: 999px; background: var(--sunken); }
.wear span { display: block; height: 100%; background: var(--accent); }
.wear.warn span { background: var(--warn); }
.wear.crit span { background: var(--crit); }
.log { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { font-family: var(--font-data); font-size: 13px; color: var(--ink-2); }
.log .by { color: var(--ink-3); }
.ld { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--line-2); vertical-align: 1px; }
.ld.acc { background: var(--accent); }
.ld.ok { background: var(--ok); }

<script>
/* DoseControl engine: simulated ward + dosing software.
   Truth: each virtual patient follows a published two-compartment vancomycin
   model (Goti et al. 2018) with clearance that can change over time.
   Software: sees only what a hospital would see (doses given, patch readings,
   morning creatinine) and estimates each patient's clearance by MAP Bayesian
   fitting of the last 24 h of patch readings, correcting for the skin delay. */
(function (root) {
  'use strict';

  const DT = 0.05;              // hours per integration step (3 min)
  const STEPS_H = 20;           // steps per hour
  const READ_STEPS = 5;         // one patch reading every 15 min
  const DAY_STEPS = 480;
  const PK = { CL: 4.5, CL_EXP: 0.8, CRCL_REF: 120, V1: 58.4, WT_REF: 70, V2: 38.4, Q: 6.5 };
  const OMEGA_CL = 0.4, OMEGA_V1 = 0.5;
  const EST_PROP = 0.15, EST_ADD = 1.0, EST_LAG = 0.75;
  const TARGET = { lo: 400, hi: 600, mid: 500 };
  const DOSE = { step: 250, min: 250, max: 2500, loadMax: 3000, rate: 1000 };
  const PATCH_LIFE_H = 72, PATCH_WARMUP_STEPS = 20, CAL_SD = 0.08;
  const CHANGE_WINDOW_H = 12, DELTA_SD = 0.15;  // clearance may shift within the last 12 h
  const MG_DL_TO_UMOL = 88.4;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  const roundDose = (x, max) => Math.min(max || DOSE.max, Math.max(DOSE.min, Math.round(x / DOSE.step) * DOSE.step));
  const infSteps = amt => Math.max(STEPS_H, Math.round(amt / DOSE.rate * STEPS_H));
  const popCl = crcl => PK.CL * Math.pow(Math.min(crcl, 150) / PK.CRCL_REF, PK.CL_EXP);
  const scrFromCrcl = (age, wt, female, crcl) => (140 - age) * wt * (female ? 0.85 : 1) / (72 * crcl);

  /* Analytic two-compartment model with optional first-order skin delay. */
  function rates(cl, v1, v2, lag) {
    const k10 = cl / v1, k12 = PK.Q / v1, k21 = PK.Q / v2;
    const s = k10 + k12 + k21, disc = Math.sqrt(s * s - 4 * k10 * k21);
    const a = (s + disc) / 2, b = (s - disc) / 2;
    const A = (a - k21) / (v1 * (a - b)), B = (k21 - b) / (v1 * (a - b));
    if (!lag) return { c: [A, B], m: [a, b] };
    let k = 1 / lag;
    if (Math.abs(k - a) < 1e-6 || Math.abs(k - b) < 1e-6) k *= 1.000001;
    const D1 = A * k / (k - a), D2 = B * k / (k - b);
    return { c: [D1, D2, -(D1 + D2)], m: [a, b, k] };
  }
  function predictAt(t, doses, R) {
    let c = 0;
    for (let i = 0; i < doses.length; i++) {
      const d = doses[i], dt = t - d.t;
      if (dt <= 0) continue;
      const tin = dt < d.tinf ? dt : d.tinf, post = dt > d.tinf ? dt - d.tinf : 0, rate = d.amt / d.tinf;
      for (let j = 0; j < R.m.length; j++) {
        const m = R.m[j];
        c += rate * R.c[j] / m * (1 - Math.exp(-m * tin)) * Math.exp(-m * post);
      }
    }
    return c;
  }

  /* Amount in the peripheral compartment at time t (analytic). */
  function periphAt(t, doses, cl, v1, v2) {
    const k10 = cl / v1, k12 = PK.Q / v1, k21 = PK.Q / v2;
    const s = k10 + k12 + k21, disc = Math.sqrt(s * s - 4 * k10 * k21), a = (s + disc) / 2, b = (s - disc) / 2;
    let A2 = 0;
    for (const d of doses) {
      const dt = t - d.t;
      if (dt <= 0) continue;
      const tin = Math.min(dt, d.tinf), post = Math.max(dt - d.tinf, 0), rate = d.amt / d.tinf;
      A2 += rate * k12 / (a - b) * ((1 - Math.exp(-b * tin)) * Math.exp(-b * post) / b - (1 - Math.exp(-a * tin)) * Math.exp(-a * post) / a);
    }
    return A2;
  }
  /* Split doses at time tc; an infusion running across tc is cut into two parts. */
  function splitDoses(doses, tc) {
    const pre = [], post = [];
    for (const d of doses) {
      const end = d.t + d.tinf;
      if (end <= tc) pre.push(d);
      else if (d.t >= tc) post.push(d);
      else {
        const rate = d.amt / d.tinf;
        pre.push({ t: d.t, amt: rate * (tc - d.t), tinf: tc - d.t });
        post.push({ t: tc, amt: rate * (end - tc), tinf: end - tc });
      }
    }
    return { pre, post };
  }
  /* Two-segment model: clearance clA before tc and clB after it. Exact
     solution: the state at tc (from clA) decays freely under clB, plus the
     doses given after tc. Lets the estimate follow a change in kidney function. */
  function makeModel(clA, clB, v1, v2, tc, doses, lag) {
    const { pre, post } = splitDoses(doses, tc);
    const RA = rates(clA, v1, v2, 0), RAl = rates(clA, v1, v2, lag);
    const A1c = predictAt(tc, pre, RA) * v1, A2c = periphAt(tc, pre, clA, v1, v2), Cc = predictAt(tc, pre, RAl);
    const k10 = clB / v1, k12 = PK.Q / v1, k21 = PK.Q / v2;
    const s = k10 + k12 + k21, disc = Math.sqrt(s * s - 4 * k10 * k21), a = (s + disc) / 2, b = (s - disc) / 2;
    const c1 = ((k10 + k12 - b) * A1c - k21 * A2c) / (a - b), c2 = A1c - c1;
    const RB = rates(clB, v1, v2, 0), RBl = rates(clB, v1, v2, lag);
    let kl = 1 / lag;
    if (Math.abs(kl - a) < 1e-6 || Math.abs(kl - b) < 1e-6) kl *= 1.000001;
    return {
      plasma(t) {
        if (t <= tc) return predictAt(t, pre, RA);
        const u = t - tc;
        return (c1 * Math.exp(-a * u) + c2 * Math.exp(-b * u)) / v1 + predictAt(t, post, RB);
      },
      isf(t) {
        if (t <= tc) return predictAt(t, pre, RAl);
        const u = t - tc, ek = Math.exp(-kl * u);
        return Cc * ek + c1 / v1 * kl / (kl - a) * (Math.exp(-a * u) - ek) + c2 / v1 * kl / (kl - b) * (Math.exp(-b * u) - ek) + predictAt(t, post, RBl);
      },
    };
  }

  /* Nelder-Mead minimiser for the small MAP problem. */
  function nelderMead(f, x0, step, iters) {
    const n = x0.length;
    let pts = [x0.slice()];
    for (let i = 0; i < n; i++) { const p = x0.slice(); p[i] += step; pts.push(p); }
    let vals = pts.map(f);
    for (let it = 0; it < iters; it++) {
      const idx = vals.map((v, i) => i).sort((a, b) => vals[a] - vals[b]);
      pts = idx.map(i => pts[i]); vals = idx.map(i => vals[i]);
      if (Math.abs(vals[n] - vals[0]) < 1e-7) break;
      const c = new Array(n).fill(0);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) c[j] += pts[i][j] / n;
      const xr = c.map((cj, j) => cj + (cj - pts[n][j])), fr = f(xr);
      if (fr < vals[0]) {
        const xe = c.map((cj, j) => cj + 2 * (cj - pts[n][j])), fe = f(xe);
        if (fe < fr) { pts[n] = xe; vals[n] = fe; } else { pts[n] = xr; vals[n] = fr; }
      } else if (fr < vals[n - 1]) { pts[n] = xr; vals[n] = fr; }
      else {
        const xc = c.map((cj, j) => cj + 0.5 * (pts[n][j] - cj)), fc = f(xc);
        if (fc < vals[n]) { pts[n] = xc; vals[n] = fc; }
        else {
          for (let i = 1; i <= n; i++) { pts[i] = pts[i].map((x, j) => pts[0][j] + 0.5 * (x - pts[0][j])); vals[i] = f(pts[i]); }
        }
      }
    }
    let best = 0;
    for (let i = 1; i <= n; i++) if (vals[i] < vals[best]) best = i;
    return { x: pts[best], f: vals[best] };
  }

  /* The virtual ward. Ages, weights and kidney function are typical of an
     adult medicine ward; names are invented. */
  const ROSTER = [
    { bed: 3, name: 'Doreen Kaplan', age: 81, sex: 'F', wt: 58, crcl: 60, tau: 12, eta: [0.15, -0.1, 0.1], lagEta: 0.1,
      indication: 'Hospital-acquired pneumonia', nextIn: 1.2, doses: 4, gain: 1.03, events: [{ type: 'aki', at: -11, factor: 0.5 }] },
    { bed: 7, name: 'Tyler Brandt', age: 24, sex: 'M', wt: 92, crcl: 138, tau: 12, eta: [0.05, 0.1, -0.1], lagEta: -0.15,
      indication: 'Infected fracture fixation, right tibia', nextIn: 1.7, doses: 5, gain: 0.98, events: [{ type: 'arc', at: -15, factor: 1.6 }] },
    { bed: 11, name: 'Samuel Nakamura', age: 70, sex: 'M', wt: 79, crcl: 66, tau: 12, eta: [0.07, 0.05, 0], lagEta: 0.05,
      indication: 'MRSA bloodstream infection', nextIn: 4.1, doses: 5, gain: 1.0, issue: { mode: 'weak', sinceH: 0.8 } },
    { bed: 5, name: 'Arjun Mehta', age: 54, sex: 'M', wt: 88, crcl: 92, tau: 12, eta: [0.1, 0, 0.05], lagEta: 0,
      indication: 'Vertebral osteomyelitis', nextIn: 6.3, doses: 6, gain: 0.96, patchAgeH: 69.4 },
    { bed: 14, name: 'Nadia Haddad', age: 37, sex: 'F', wt: 61, crcl: 104, tau: 12, eta: [0.3, -0.15, 0], lagEta: -0.05,
      indication: 'Suspected sepsis, cultures pending', nextIn: 9.6, doses: 1, gain: 1.04, patchAgeH: 1.9 },
    { bed: 1, name: 'Harold Fenwick', age: 78, sex: 'M', wt: 72, crcl: 58, tau: 12, eta: [0.35, -0.05, 0.05], lagEta: 0,
      indication: 'MRSA cellulitis, left leg', nextIn: 2.6, doses: 6, gain: 1.0 },
    { bed: 9, name: 'Lucia Ferreira', age: 63, sex: 'F', wt: 66, crcl: 71, tau: 12, eta: [-0.35, 0.1, 0], lagEta: 0.1,
      indication: 'Prosthetic knee infection', nextIn: 7.4, doses: 9, gain: 1.02 },
    { bed: 12, name: 'Grace Whitford', age: 46, sex: 'F', wt: 101, crcl: 118, tau: 12, eta: [-0.1, 0.05, -0.05], lagEta: 0,
      indication: 'Abscess with spreading cellulitis', nextIn: 5.1, doses: 4, gain: 0.99 },
  ];

  const NURSES = { day: 'P. Singh, RN', night: 'J. Okafor, RN' };
  const PHARMACIST = 'R. Dubois, pharmacist';

  class Ward {
    /* originClockH: clock time at "now" (hours since local midnight, multiple of 0.05). */
    constructor(originClockH, seed, roster) {
      this.seed = seed || 20261031;
      this.originStep = Math.round(originClockH / DT);
      this.events = [];
      this.patients = (roster || ROSTER).map((s, i) => this.makePatient(s, i));
      this.k = Math.min(...this.patients.map(p => p.kStart)) - STEPS_H;
      this.processedK = this.k - 1;
      this.live = false;
      this.listeners = [];
      this.advanceTo(0);
      this.live = true;
    }

    /* ---------- time ---------- */
    get t() { return this.k * DT; }
    clockSteps(k) { return this.originStep + k; }               // steps since midnight of day 0
    isHourBoundary(k) { return ((this.clockSteps(k) % STEPS_H) + STEPS_H) % STEPS_H === 0; }
    nurseAt(k) {
      const h = (((this.clockSteps(k) % DAY_STEPS) + DAY_STEPS) % DAY_STEPS) / STEPS_H;
      return h >= 7 && h < 19 ? NURSES.day : NURSES.night;
    }

    makePatient(s, i) {
      const r = mulberry32(this.seed + s.bed * 7919);
      const female = s.sex === 'F';
      const clpop0 = popCl(s.crcl);
      const tauK = s.tau * STEPS_H;
      // next dose snapped to the next clock hour at least nextIn hours away
      let kNext = Math.round(s.nextIn * STEPS_H);
      while (!this.isHourBoundary(kNext)) kNext++;
      const kStart = kNext - s.doses * tauK;
      const patchAge = s.patchAgeH != null ? s.patchAgeH : (-kStart * DT) - 0.25;
      let kPatch = -Math.round(patchAge * STEPS_H);
      kPatch -= ((kPatch % READ_STEPS) + READ_STEPS) % READ_STEPS;
      const p = {
        id: 'bed-' + s.bed, bed: s.bed, name: s.name, age: s.age, sex: s.sex, female, wt: s.wt,
        indication: s.indication, tau: s.tau, tauK, kStart, r, gainSpec: s.gain,
        crcl0: s.crcl,
        truth: {
          cl0: clpop0 * Math.exp(s.eta[0]), v1: PK.V1 * s.wt / PK.WT_REF * Math.exp(s.eta[1]),
          v2: PK.V2 * Math.exp(s.eta[2]), lag: EST_LAG * Math.exp(s.lagEta || 0),
          events: (s.events || []).map(e => ({ ...e })), A1: 0, A2: 0, Cisf: 0,
        },
        patch: null,
        doses: [], readings: [], est: [], fits: [], labs: [], log: [],
        regimen: { dose: roundDose(TARGET.mid * clpop0 * s.tau / 24), nextK: kStart, loading: roundDose(25 * s.wt, DOSE.loadMax) },
        fit: null, rec: null, snoozeK: -Infinity, decisionK: null,
      };
      p.patchSpec = { k: kPatch, fixedAge: s.patchAgeH != null, issue: s.issue ? { mode: s.issue.mode, k: -Math.round(s.issue.sinceH * STEPS_H) } : null };
      // baseline creatinine, drawn on admission
      this.addLab(p, kStart - 2 * STEPS_H, s.crcl, true);
      return p;
    }

    newPatch(p, k, quiet) {
      const r = p.r;

    sun: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',

    auto: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.2a6.8 6.8 0 0 1 0 13.6Z" fill="currentColor"/></svg>',
  };
  const STATUS = {
    review: { label: 'Review dose', cls: 'crit', icon: ICON.alert },

    settling: { label: 'Settling', cls: 'info', icon: ICON.wave },

    expired: { label: 'Replace patch', cls: 'crit' },

  /* ---------- state ---------- */

    filter: 'all',

    theme: store.get('dc-theme', 'auto'),
    range: 24, drawer: null, opener: null,
    decision: blankDecision(), patchConfirm: null, acked: new Set(), showAllLog: false, hover: null, demoPid: 'bed-1',

  const mcache = new Map();

  /* ---------- clock (wall-clock arithmetic, so daylight-saving changes don't shift dose times) ---------- */
  function initClock() {
    const real = new Date();
    const originClockH = Math.floor((real.getHours() * 60 + real.getMinutes()) / 3) * 3 / 60;
    clock = {
      originClockH,
      day0: new Date(real.getFullYear(), real.getMonth(), real.getDate()),

  function fmtDur(h) {
    if (h <= 0.01) return 'under a minute';
    const m = Math.round(h * 60);
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + pad(m % 60) + ' min' : '');
  }
  const untilK = k => fmtDur(k * DT - sim.vt);

  function boot() {
    initClock();
    ward = new E.Ward(clock.originClockH);
    ward.onChange(() => { dirty = true; });
    sim = { vt: clock.vtStart, speed: sim ? sim.speed : 1, paused: false, last: performance.now() };
    UI.decision = blankDecision(); UI.patchConfirm = null; UI.acked = new Set(); UI.hover = null;
    main.dataset.view = ''; dirty = true; forceDecision = true;
  }

  /* ---------- helpers ---------- */
  function niceScale(vmax, steps) {
    const raw = vmax / steps, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const s = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return { max: s * mag * Math.ceil(vmax / (s * mag)), step: s * mag };
  }
  const nearest = (arr, k, key) => { let best = null, bd = Infinity; for (const o of arr) { const d = Math.abs(o.k - k); if (d < bd) { bd = d; best = o; } } return best; };
  function withFocus(fn) {

  }
  let toastTimer = null;
  function toast(msg) {

    toastTimer = setTimeout(() => { t.hidden = true; }, 4600);
  }
  const route = () => { const id = decodeURIComponent(location.hash.slice(1)); return ward.get(id) ? id : null; };
  function patchEndsK(p) { return p.patch.k + E.PATCH_LIFE_H * SH; }
  function readyIn(p, m) {
    let mins = 0;
    if (p.patch && ward.k - p.patch.k < 20) mins += (20 - (ward.k - p.patch.k)) * 3;
    mins += Math.max(0, 8 - m.nObs) * 15;
    return fmtDur(Math.max(15, mins) / 60);
  }

  /* ---------- alerts ---------- */
  function computeAlerts() {
    const out = [];
    for (const p of ward.patients) {
      const m = M(p), P = p.patch;
      if (p.rec) out.push({ key: `${p.id}:rec:${p.rec.k}:${p.rec.dose}`, sev: 2, p, k: p.rec.updatedK, title: 'Dose review needed', text: `${p.rec.dose < p.regimen.dose ? 'Lower' : 'Raise'} the dose to ${fmtMg(p.rec.dose)}. Review before the ${timeOnly(p.regimen.nextK)} dose.` });
      if (m.sensor === 'lost') out.push({ key: `${p.id}:lost:${P.issue.k}`, sev: 2, p, k: P.issue.k, title: 'Patch signal lost', text: 'Check the patch and the reader. Dose checks use the last estimate until readings return.' });
      if (m.sensor === 'weak') out.push({ key: `${p.id}:weak:${P.issue.k}`, sev: 1, p, k: P.issue.k, title: 'Patch signal weak', text: 'Readings are noisy or missing, so dose suggestions are paused. Check that the patch is firmly attached.' });
      if (m.sensor === 'expired') out.push({ key: `${p.id}:expired:${P.k}`, sev: 2, p, k: patchEndsK(p), title: 'Patch expired', text: 'Apply a new patch to keep monitoring this patient.' });
      if (m.sensor === 'expiring') out.push({ key: `${p.id}:expiring:${P.k}`, sev: 1, p, k: ward.k, title: 'Patch ends soon', text: `The patch reaches 72 hours at ${timeK(patchEndsK(p))}. Plan a replacement.` });

    }
    return out.sort((a, b) => b.sev - a.sev || b.k - a.k);
  }

  /* ---------- top bar ---------- */
  function updateClock() {
    const w = wallAt(sim.vt);

    pill.setAttribute('aria-label', `${n} patient${n === 1 ? '' : 's'} to review`);

  }

    else r.setAttribute('data-theme', UI.theme);

  /* ---------- ward board ---------- */
  function gauge(m) {
    const pos = v => Math.max(0, Math.min(100, (v - 200) / 600 * 100));

    return `<div class="gauge" role="img" aria-label="${label}"><span class="g-band" style="left:${pos(400)}%;width:${pos(600) - pos(400)}%"></span><span class="g-ring" style="left:${pos(m.ss)}%"></span>${m.auc24 != null ? `<span class="g-dot" style="left:${pos(m.auc24)}%"></span>` : ''}</div>
      <div class="g-scale" aria-hidden="true"><span style="left:${pos(400)}%">400</span><span style="left:${pos(600)}%">600</span></div>`;
  }
  function trendHtml(m) {

    return `<span class="trend">${t[0]}${t[1]}</span>`;
  }
  function patchShort(p, m) {

  function card(p, m) {
    const S = STATUS[m.status], sen = SENSOR[m.sensor];

      body = `<div class="est-note">${ICON.clock}<span>Building this patient's first estimate. Ready in about ${readyIn(p, m)}.</span></div>`;
    } else {
      body = `<div><div class="lbl">${m.auc24 != null ? 'Exposure, last 24 h' : 'Expected exposure'}</div>
        <div class="exp-v"><span class="num">${fmtInt(m.auc24 != null ? m.auc24 : m.ss)}</span><span class="unit">mg·h/L</span>${trendHtml(m)}</div>
        ${gauge(m)}
        ${m.auc24 != null ? `<div class="exp-f"><span class="k-ring" aria-hidden="true"></span>Expected on current dose: <b class="mono">${fmtInt(m.ss)}</b></div>` : ''}</div>`;
    }

      ${det}

    </a>`;
  }
  function renderWard() {
    if (main.dataset.view !== 'ward') { main.dataset.view = 'ward'; UI.hover = null; }
    const list = ward.patients.map(p => ({ p, m: M(p) }));
    const isWatch = m => m.status === 'watch' || m.status === 'settling';
    const isPatch = m => m.sensor !== 'good';
    const counts = { all: list.length, review: list.filter(x => x.m.status === 'review').length, watch: list.filter(x => isWatch(x.m)).length, patch: list.filter(x => isPatch(x.m)).length };
    const pass = { all: () => true, review: x => x.m.status === 'review', watch: x => isWatch(x.m), patch: x => isPatch(x.m) }[UI.filter];
    const order = { review: 0, watch: 1, settling: 2, estimating: 3, ok: 4 };
    const shown = list.filter(pass).sort((a, b) => order[a.m.status] - order[b.m.status] || (a.m.status === 'review' ? a.m.nextK - b.m.nextK : a.p.bed - b.p.bed));

        <div class="ward-head">

          <div class="ward-tools">

    });

  }
  function drawSparks() {
    main.querySelectorAll('[data-spark]').forEach(el => {
      const p = ward.get(el.dataset.spark), W = Math.max(120, Math.round(el.clientWidth)), H = 36;
      const k0 = ward.k - 12 * SH, pts = p.est.filter(o => o.k >= k0);
      if (pts.length < 2) { el.innerHTML = ''; return; }
      const vmax = Math.max(1, ...pts.map(o => o.c)) * 1.12;

    });
  }

  /* ---------- patient page ---------- */
  function patchText(p, m) {
    if (!p.patch) return 'None';
    if (m.sensor === 'expired') return 'Expired';
    if (m.sensor === 'warmup') return 'Warming up';

    return `${Math.floor(m.patchAgeH)} h of 72 h · ${sig}`;
  }
  function headHtml(p, m) {
    const S = STATUS[m.status], sen = SENSOR[m.sensor], labs = m.labs, lab = labs[labs.length - 1], lab0 = labs[0];
    const facts = [
      ['Current dose', `${fmtMg(p.regimen.dose)} IV every ${p.tau} h`],
      ['Next dose', `${timeOnly(m.nextK)} <span class="muted">in ${untilK(m.nextK)}</span>`],

    ];
    return `<div class="pv-title"><span class="bed">Bed ${p.bed}</span><h1>${esc(p.name)}</h1>${chip(S)}${sen ? chip(sen, ICON.patch) : ''}</div>
      <p class="sub">${p.age} ${p.sex === 'F' ? 'female' : 'male'} · ${p.wt} kg · ${esc(p.indication)} · Day ${m.day} of vancomycin</p>
      <dl class="facts">${facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  }
  function reasons(p, m) {
    const out = [], first = esc(p.name.split(' ')[0]);
    if (m.clChange != null && Math.abs(m.clChange) >= 0.1) {
      const slower = m.clChange < 0;
      out.push(`${first} is clearing the drug <b>${Math.round(Math.abs(m.clChange) * 100)}% ${slower ? 'slower' : 'faster'}</b> than 24 hours ago. ${slower ? 'This often means kidney function is falling.' : 'Faster clearance is common in younger or critically ill patients.'}`);
    }

    if (labs.length >= 2) {
      const a = labs[labs.length - 2], b = labs[labs.length - 1], ch = b.scrUmol / a.scrUmol - 1;
      if (Math.abs(ch) >= 0.15) out.push(`Creatinine ${ch > 0 ? 'rose' : 'fell'} from ${fmtInt(a.scrUmol)} to ${fmtInt(b.scrUmol)} µmol/L (test at ${timeK(b.k)}).`);
      else if (m.clChange != null && m.clChange <= -0.15) out.push(`Creatinine has not risen yet (${fmtInt(b.scrUmol)} µmol/L at ${timeK(b.k)}). The patch usually shows a kidney change first.`);
    }
    out.push(`On ${fmtMg(p.regimen.dose)}, daily exposure is expected to settle near <b>${fmtInt(m.ss)} mg·h/L</b>, ${m.ss > E.TARGET.hi ? 'above' : 'below'} the 400–600 target.`);

  }
  const tag = v => v > E.TARGET.hi ? '<span class="tag crit">Above target</span>' : v < E.TARGET.lo ? '<span class="tag warn">Below target</span>' : '<span class="tag ok">In target</span>';
  function modePanel(p, m, D) {

      const x = X(kk);
      guide.setAttribute('x1', x); guide.setAttribute('x2', x); guide.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', x); dot.setAttribute('cy', Y(yv)); dot.setAttribute('visibility', 'visible');
      tip.innerHTML = `<div class="tip-t">${timeK(kk)}</div>` + rows.map(r => `<div>${r}</div>`).join('');
      tip.hidden = false;
      const scale = svg.getBoundingClientRect().width / W, px = x * scale, tw = tip.offsetWidth, cw = el.clientWidth;
      tip.style.left = (px + 14 + tw > cw ? Math.max(0, px - tw - 14) : px + 14) + 'px';
      UI.hover = { id: 'ch-level', xv };
    };
    svg.addEventListener('pointermove', ev => { const r = svg.getBoundingClientRect(); show((ev.clientX - r.left) * W / r.width); });
    svg.addEventListener('pointerleave', () => { guide.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; UI.hover = null; });
    if (UI.hover && UI.hover.id === 'ch-level') show(UI.hover.xv);
  }
  function drawExposure(el, p) {
    if (!el) return;
    const days = ward.dayExposures(p);
    if (!days.length) { el.innerHTML = '<p class="empty">Shown once the first 24 hours of treatment are complete.</p>'; return; }
    const W = Math.max(280, Math.round(el.clientWidth)), H = 220, L = 46, R = 12, T = 22, B = 30, pw = W - L - R, ph = H - T - B;
    const yt = niceScale(Math.max(800, ...days.map(d => d.auc * 1.14)), 4), Y = v => T + ph - v / yt.max * ph;
    const slot = pw / days.length, bw = Math.min(46, slot * 0.58), short = slot < 64;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Daily exposure by treatment day against the 400 to 600 target">`;
    s += `<rect class="c-band" x="${L}" y="${Y(600).toFixed(1)}" width="${pw}" height="${(Y(400) - Y(600)).toFixed(1)}"/>`;
    for (let v = 0; v <= yt.max + 1e-9; v += yt.step) s += `<line class="c-grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="c-ax" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    for (const v of [400, 600]) if ((v / yt.step) % 1) s += `<text class="c-ax" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    s += `<line class="c-bandline" x1="${L}" x2="${W - R}" y1="${Y(600).toFixed(1)}" y2="${Y(600).toFixed(1)}"/><line class="c-bandline" x1="${L}" x2="${W - R}" y1="${Y(400).toFixed(1)}" y2="${Y(400).toFixed(1)}"/>`;
    s += `<text class="c-bandl" x="${W - R - 4}" y="${(Y(600) + 14).toFixed(1)}" text-anchor="end">Target</text>`;
    days.forEach((d, i) => {
      const x = L + i * slot + (slot - bw) / 2, y = Y(d.auc), h = Y(0) - y, r = Math.min(4, h / 2, bw / 2);
      const cls = d.auc > E.TARGET.hi ? 'c-bar-hi' : d.auc < E.TARGET.lo ? 'c-bar-lo' : 'c-bar';
      const lab = short ? (d.rolling ? '24 h' : 'D' + (i + 1)) : d.label;
      s += `<path class="${cls}" d="M${x.toFixed(1)},${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + bw - r).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z"><title>${d.label}: ${fmtInt(d.auc)} mg·h/L, ${d.auc > E.TARGET.hi ? 'above' : d.auc < E.TARGET.lo ? 'below' : 'in'} target</title></path>`;
      const ly = y - 6, onBand = ly <= Y(400) + 2 && ly >= Y(600) - 2;
      s += `<text class="c-val${onBand ? ' on-band' : ''}" x="${(x + bw / 2).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${fmtInt(d.auc)}</text>`;
      s += `<text class="c-ax" x="${(x + bw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle"${d.rolling ? ' font-weight="500"' : ''}>${lab}</text>`;
    });
    el.innerHTML = s + '</svg>';
  }
  function drawClearance(el, p) {
    if (!el) return;
    const kNow = ward.k, k0 = kNow - UI.range * SH;
    const fits = p.fits.filter(f => !f.learning && f.k >= k0 && f.k <= kNow);
    if (fits.length < 2) { el.innerHTML = '<p class="empty">Shown once DoseControl has an estimate.</p>'; return; }
    const W = Math.max(280, Math.round(el.clientWidth)), H = 210, L = 46, R = 14, T = 24, B = 28, pw = W - L - R, ph = H - T - B;
    const X = k => L + (k - k0) / (kNow - k0) * pw, z = 1.645;
    const hi = f => f.cl * Math.exp(z * f.sd), lo = f => f.cl * Math.exp(-z * f.sd);
    const yt = niceScale(Math.max(...fits.map(hi)) * 1.08, 4), Y = v => T + ph - v / yt.max * ph;
    const P = (arr, fn) => arr.map((f, i) => (i ? 'L' : 'M') + X(f.k).toFixed(1) + ',' + Y(fn(f)).toFixed(1)).join('');
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Estimated drug clearance over time with its 90 percent range">`;
    for (let v = 0; v <= yt.max + 1e-9; v += yt.step) s += `<line class="c-grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="c-ax" x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${+v.toFixed(2)}</text>`;
    s += `<text class="c-ax" x="${L - 8}" y="${T - 10}" text-anchor="end">L/h</text>`;
    s += xTicks(k0, kNow, X, H, W, R);
    s += `<path class="c-ci" d="${P(fits, hi)}${fits.slice().reverse().map(f => 'L' + X(f.k).toFixed(1) + ',' + Y(lo(f)).toFixed(1)).join('')}Z"/>`;
    s += `<path class="c-est" d="${P(fits, f => f.cl)}"/>`;
    const e = fits[fits.length - 1];
    s += `<circle class="c-end" cx="${X(e.k).toFixed(1)}" cy="${Y(e.cl).toFixed(1)}" r="4"><title>Now: ${e.cl.toFixed(2)} L/h</title></circle></svg>`;
    el.innerHTML = s;
  }

  /* ---------- drawers ---------- */
  const closeBtn = '<button class="icon-btn" data-action="close-drawer" data-key="close-drawer" aria-label="Close">' + ICON.close + '</button>';
  function alertsHtml() {
    const all = computeAlerts(), open = all.filter(a => !UI.acked.has(a.key)), done = all.filter(a => UI.acked.has(a.key));
    const item = (a, acked) => `<article class="alert sev${a.sev}">
      <div class="alert-h"><span class="ai ${a.sev === 2 ? 'crit' : 'warn'}">${a.sev === 2 ? ICON.alert : ICON.warn}</span><span>${esc(a.title)}</span></div>
      <div class="meta">Bed ${a.p.bed} · ${esc(a.p.name)} · ${timeK(a.k)}</div><p>${esc(a.text)}</p>
      <div class="actions"><button class="btn small" data-action="goto" data-v="${a.p.id}" data-key="goto-${esc(a.key)}">Open patient</button>${acked ? '' : `<button class="btn small quiet" data-action="ack" data-v="${esc(a.key)}" data-key="ack-${esc(a.key)}">Acknowledge</button>`}</div></article>`;
    return `<div class="drawer-h"><h2 id="drawer-title">Alerts</h2>${closeBtn}</div>
      <p class="fine">Only alerts that need someone to act. Acknowledged alerts come back if the situation changes.</p>
      ${open.length ? open.map(a => item(a, false)).join('') : '<p class="empty">No open alerts.</p>'}
      ${done.length ? `<h3>Acknowledged</h3>${done.map(a => item(a, true)).join('')}` : ''}`;
  }
  function handoverText() {
    mcache.clear();
    const w = wallAt(sim.vt);
    const lines = [`DoseControl handover · Ward 4B · ${dayDate(w.day).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' })} ${hhmm(w)}`, 'Simulated patients (prototype).', ''];
    ward.patients.slice().sort((a, b) => a.bed - b.bed).forEach(p => {
      const m = M(p);
      let t = `Bed ${p.bed} · ${p.name} · ${fmtMg(p.regimen.dose)} q${p.tau}h, next ${timeOnly(m.nextK)}`;
      t += m.status === 'estimating' ? ' · first estimate pending' : ` · exposure ${m.auc24 != null ? fmtInt(m.auc24) : 'n/a'} last 24 h, expected ${fmtInt(m.ss)}`;
      if (p.rec) t += ` · REVIEW: ${p.rec.dose < p.regimen.dose ? 'lower' : 'raise'} to ${fmtMg(p.rec.dose)} before ${timeOnly(p.regimen.nextK)}`;
      if (m.sensor !== 'good') t += ` · patch: ${SENSOR[m.sensor].label.toLowerCase()}`;
      lines.push(t);
    });
    return lines.join('\n');
  }
  function handoverHtml() {
    return `<div class="drawer-h"><h2 id="drawer-title">Handover summary</h2>${closeBtn}</div>
      <p class="fine">One line per patient, ready to paste into handover notes.</p>
      <textarea id="handover-text" readonly aria-label="Handover summary text">${esc(handoverText())}</textarea>
      <div class="actions"><button class="btn primary" data-action="copy" data-key="copy">Copy summary</button></div>`;
  }
  function demoHtml() {
    const opts = ward.patients.slice().sort((a, b) => a.bed - b.bed).map(p => `<option value="${p.id}"${p.id === UI.demoPid ? ' selected' : ''}>Bed ${p.bed} · ${esc(p.name)}</option>`).join('');
    const speeds = [[1, 'Real time'], [60, '×60'], [600, '×600'], [3600, '×3,600']];
    return `<div class="drawer-h"><h2 id="drawer-title">Demo controls</h2>${closeBtn}</div>
      <p class="fine">For presentations only. These controls change the simulated patients; nurses would not see this panel.</p>
      <h3>Clock</h3>
      <div class="seg" role="group" aria-label="Simulation speed" id="speed-seg">${speeds.map(([v, l]) => `<button data-action="speed" data-v="${v}" data-key="sp-${v}" aria-pressed="${sim.speed === v && !sim.paused}">${l}</button>`).join('')}</div>
      <p class="fine">At ×600 one hour passes every 6 seconds; at ×3,600, every second.</p>
      <div class="actions"><button class="btn small" id="pause-btn" data-action="pause" data-key="pause">${sim.paused ? 'Resume' : 'Pause'}</button><button class="btn small" data-action="jump" data-v="1" data-key="jump1">Skip 1 hour</button><button class="btn small" data-action="jump" data-v="6" data-key="jump6">Skip 6 hours</button></div>
      <h3>Patient events</h3>
      <div class="field"><label for="demo-pid">Patient</label><select id="demo-pid">${opts}</select></div>
      <div class="demo-list">
        <button class="btn small" data-action="demo-aki" data-key="d-aki">Start kidney injury</button>
        <button class="btn small" data-action="demo-arc" data-key="d-arc">Start faster clearance</button>
        <button class="btn small" data-action="demo-weak" data-key="d-weak">Weaken patch signal</button>
        <button class="btn small" data-action="demo-lost" data-key="d-lost">Cut patch signal</button>
        <button class="btn small" data-action="demo-restore" data-key="d-restore">Restore signal</button>
      </div>
      <p class="fine">Kidney changes build up slowly, as in real patients: a recommendation usually appears 7 to 14 simulated hours later, so about 10 seconds at ×3,600. Bed 1 responds fastest; patients who clear the drug slowly, like Bed 9, take longer.</p>
      <h3>Reset</h3>
      <div><button class="btn small" data-action="demo-reset" data-key="d-reset">Reset all patients</button></div>`;
  }
  function renderDrawer() {
    const d = $('#drawer');
    withFocus(() => { d.innerHTML = UI.drawer === 'alerts' ? alertsHtml() : UI.drawer === 'handover' ? handoverHtml() : demoHtml(); });
  }
  function syncDemo() {
    const seg = $('#speed-seg');
    if (seg) seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === sim.speed && !sim.paused)));
    const pb = $('#pause-btn');
    if (pb) pb.textContent = sim.paused ? 'Resume' : 'Pause';
  }
  function openDrawer(kind, opener) {
    UI.drawer = kind; UI.opener = opener;
    mcache.clear(); renderDrawer();
    $('#drawer').hidden = false; $('#scrim').hidden = false;
    const c = $('#drawer [data-action="close-drawer"]');
    if (c) c.focus();
  }
  function closeDrawer() {
    UI.drawer = null; $('#drawer').hidden = true; $('#scrim').hidden = true;
    if (UI.opener && document.body.contains(UI.opener)) UI.opener.focus();
    UI.opener = null;
  }

  /* ---------- render loop ---------- */
  function render() {
    mcache.clear();
    renderBar();
    const id = route();
    if (id) renderPatient(ward.get(id)); else renderWard();
    if (UI.drawer === 'alerts') renderDrawer();
    if (UI.drawer === 'demo') syncDemo();
  }
  function tick() {
    const now = performance.now();
    let dt = (now - sim.last) / 1000;
    sim.last = now;
    if (sim.speed > 1) dt = Math.min(dt, 1);
    if (!sim.paused) sim.vt += dt * sim.speed / 3600;
    const kT = Math.floor(sim.vt / DT + 1e-9);
    if (kT > ward.k) ward.advanceTo(kT);
    updateClock();
    const minute = Math.floor(sim.vt * 60);
    if (minute !== lastMinute) { lastMinute = minute; dirty = true; }
    if (dirty && now - lastRender > 240) { lastRender = now; dirty = false; render(); }
  }

  /* ---------- events ---------- */
  function currentPatient() { const id = route(); return id ? ward.get(id) : null; }
  function confirmDecision() {
    const D = UI.decision, p = ward.get(D.pid);
    if (!p || !p.rec) return;
    const next = timeOnly(p.regimen.nextK);
    if (D.mode === 'approve') {
      const dose = p.rec.dose;
      ward.approve(p.id, dose, NURSE.sign);
      toast(`Approved ${fmtMg(dose)} every ${p.tau} h from the ${next} dose. Sent to pharmacy.`);
    } else if (D.mode === 'change') {
      const dose = D.dose, reason = dose !== p.rec.dose ? D.reason : '';
      ward.approve(p.id, dose, NURSE.sign, reason);
      toast(`Dose set to ${fmtMg(dose)} every ${p.tau} h from the ${next} dose. Sent to pharmacy.`);
    } else if (D.mode === 'decline') {
      const stay = p.regimen.dose;
      ward.decline(p.id, NURSE.sign, D.reason);
      toast(`Recommendation declined. Bed ${p.bed} stays on ${fmtMg(stay)}.`);
    }
    UI.decision = blankDecision(); forceDecision = true;
    render();
    const h = $('#pv-decision h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  function copyHandover(btn) {
    const ta = $('#handover-text');
    ta.value = handoverText();
    const fallback = () => { ta.focus(); ta.select(); toast('Text selected. Press Ctrl+C or ⌘C to copy it.'); };
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy summary'; }, 1800); };
    try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const a = b.dataset.action, v = b.dataset.v, p = currentPatient();
    switch (a) {
      case 'filter':
        UI.filter = v;
        if (route()) location.hash = ''; else render();
        break;
      case 'view': UI.detail = v === 'detailed'; store.set('dc-detail', v); UI.hover = null; render(); break;
      case 'theme': UI.theme = { auto: 'light', light: 'dark', dark: 'auto' }[UI.theme] || 'auto'; store.set('dc-theme', UI.theme); applyTheme(); render(); break;
      case 'open-alerts': openDrawer('alerts', b); break;
      case 'open-handover': openDrawer('handover', b); break;
      case 'open-demo': openDrawer('demo', b); break;
      case 'close-drawer': closeDrawer(); break;
      case 'ack': UI.acked.add(v); render(); renderDrawer(); break;
      case 'goto': closeDrawer(); location.hash = v; break;
      case 'range': UI.range = +v; UI.hover = null; render(); break;
      case 'log-all': UI.showAllLog = !UI.showAllLog; render(); break;
      case 'dec-mode':
        if (!p || !p.rec) break;
        UI.decision = v ? { pid: p.id, mode: v, dose: p.rec.dose, reason: '', checked: false, recKey: p.rec.k + ':' + p.rec.dose } : blankDecision();
        forceDecision = true; render();
        { const first = v === 'approve' ? $('#dec-check') : v === 'change' ? $('input[name="dec-dose"]:checked') : v === 'decline' ? $('#dec-reason') : $('[data-key="dec-approve"]'); if (first) first.focus(); }
        break;
      case 'dec-confirm': confirmDecision(); break;
      case 'patch-new': if (p) { UI.patchConfirm = p.id; render(); const c = $('[data-key="patch-confirm"]'); if (c) c.focus(); } break;
      case 'patch-cancel': UI.patchConfirm = null; render(); break;
      case 'patch-confirm':
        if (p) { ward.replacePatch(p.id, NURSE.sign); UI.patchConfirm = null; toast(`New patch recorded for Bed ${p.bed}. Readings resume in about 1 hour.`); render(); }
        break;
      case 'copy': copyHandover(b); break;
      case 'speed': sim.speed = +v; sim.paused = false; syncDemo(); updateClock(); dirty = true; break;
      case 'pause': sim.paused = !sim.paused; syncDemo(); updateClock(); break;
      case 'jump': sim.vt += +v; ward.advanceTo(Math.floor(sim.vt / DT + 1e-9)); updateClock(); render(); toast(`Skipped ahead ${v} hour${+v === 1 ? '' : 's'}.`); break;
      case 'demo-aki': ward.simulateKidneyInjury(UI.demoPid); toast(`Kidney injury started for ${bedName(UI.demoPid)}. Clearance will fall over the next few hours.`); break;
      case 'demo-arc': ward.simulateFastClearance(UI.demoPid); toast(`Faster clearance started for ${bedName(UI.demoPid)}.`); break;
      case 'demo-weak': ward.simulateSignal(UI.demoPid, 'weak'); toast(`Patch signal weakened for ${bedName(UI.demoPid)}.`); break;
      case 'demo-lost': ward.simulateSignal(UI.demoPid, 'lost'); toast(`Patch signal cut for ${bedName(UI.demoPid)}.`); break;
      case 'demo-restore': ward.simulateSignal(UI.demoPid, null); toast(`Patch signal restored for ${bedName(UI.demoPid)}.`); break;
      case 'demo-reset': boot(); updateClock(); render(); renderDrawer(); toast('All patients reset.'); break;
    }
  });
  function bedName(id) { const p = ward.get(id); return `Bed ${p.bed}`; }
  document.addEventListener('change', e => {
    const t = e.target, D = UI.decision;
    if (t.id === 'dec-check') { D.checked = t.checked; syncDecisionControls(); }
    else if (t.name === 'dec-dose') { D.dose = +t.value; syncDecisionControls(); }
    else if (t.id === 'dec-reason') { D.reason = t.value; syncDecisionControls(); }
    else if (t.id === 'demo-pid') { UI.demoPid = t.value; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.drawer) closeDrawer(); });
  window.addEventListener('hashchange', () => {
    UI.hover = null; UI.patchConfirm = null;
    if (UI.decision.pid && UI.decision.pid !== route()) UI.decision = blankDecision();
    render(); window.scrollTo(0, 0);
  });
  let resizeTimer = null;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { dirty = true; }, 120); });

  boot();
  applyTheme();
  updateClock();
  render();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
